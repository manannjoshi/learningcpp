name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # dry run: builds + uploads artifacts, no release

permissions:
  contents: read

env:
  PROJECT: learning-cpp

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-universal      # x86_64 + arm64 fat binaries
            os: macos-14
          - target: windows-x86_64
            os: windows-2022
            msvc_arch: x64
          - target: windows-arm64         # cross-compiled from the x64 host
            os: windows-2022
            msvc_arch: ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Configure
        shell: bash
        run: |
          EXTRA=()
          case "${{ matrix.target }}" in
            linux-*)
              EXTRA+=(-DSTATIC_LINK=ON)
              ;;
            darwin-*)
              EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64")
              EXTRA+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
              ;;
          esac
          if [[ -n "${{ matrix.msvc_arch }}" ]]; then
            EXTRA+=(-A "${{ matrix.msvc_arch }}")
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test (native targets only)
        if: matrix.target != 'windows-arm64'
        shell: bash
        run: |
          cmake --install build --config Release --prefix smoke
          ls -R smoke/bin | head -50

      - name: Package
        shell: bash
        run: |
          PKG="${PROJECT}-${VERSION}-${{ matrix.target }}"
          cmake --install build --config Release --prefix "staging/${PKG}"
          cp README.md "staging/${PKG}/" 2>/dev/null || true
          cd staging
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "../${PKG}.zip" "${PKG}" > /dev/null
          else
            tar -czf "../${PKG}.tar.gz" "${PKG}"
          fi
          cd ..
          ls -lh ${PKG}.*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  release:
    name: sign & publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the release
      id-token: write        # OIDC token for keyless signing
      attestations: write    # build provenance
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum *.tar.gz *.zip | tee SHA256SUMS

      - uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (Sigstore keyless)
        working-directory: dist
        run: |
          shopt -s nullglob
          for f in *.tar.gz *.zip SHA256SUMS; do
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "$f"
          done
          ls -1

      - name: GPG-sign SHA256SUMS (optional)
        if: env.GPG_PRIVATE_KEY != ''
        working-directory: dist
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor -o SHA256SUMS.asc SHA256SUMS

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ### Verify

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing

            cosign verify-blob \
              --bundle learning-cpp-${{ github.ref_name }}-linux-x86_64.tar.gz.cosign.bundle \
              --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              learning-cpp-${{ github.ref_name }}-linux-x86_64.tar.gz

            gh attestation verify learning-cpp-${{ github.ref_name }}-linux-x86_64.tar.gz \
              --repo ${{ github.repository }}
            ```